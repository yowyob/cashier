name: Deploy (server)

# Déploiement du front caisse sur le serveur yowyob.
# S'enchaîne APRÈS la publication GHCR (workflow "Publish Docker image (GHCR)") :
# on ne déploie que si l'image du commit a bien été poussée sur GHCR.
# Le serveur ne reçoit AUCUN code source : seulement docker-compose.prod.yml,
# puis `docker compose pull && up` de l'image GHCR (source de vérité = ce dépôt).
# Le .env (AUTH_SECRET, KERNEL_CLIENT_SECRET, ERP_TENANT_ID) reste géré UNIQUEMENT sur le serveur.

on:
  workflow_run:
    workflows: ["Publish Docker image (GHCR)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cashier
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.repository == 'yowyob/cashier' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Checkout (pour docker-compose.prod.yml)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Calculer le tag d'image immuable (GHCR, par SHA)
        id: img
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          REPO="${GITHUB_REPOSITORY,,}"          # owner/repo en minuscules
          echo "image=ghcr.io/${REPO}:sha-${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Préparer la clé SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copier le docker-compose.prod.yml
        run: |
          scp -i ~/.ssh/id_deploy docker-compose.prod.yml \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.CASHIER_FRONT_DIR }}/docker-compose.prod.yml"

      - name: Pull + up sur le serveur
        env:
          CASHIER_FRONTEND_IMAGE: ${{ steps.img.outputs.image }}
        run: |
          ssh -i ~/.ssh/id_deploy "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" "
            set -e
            cd '${{ vars.CASHIER_FRONT_DIR }}'
            # Le serveur dispose déjà d'une auth GHCR persistante (read:packages sur l'org yowyob).
            export CASHIER_FRONTEND_IMAGE='${CASHIER_FRONTEND_IMAGE}'
            # .env (secrets runtime) géré UNIQUEMENT sur le serveur, jamais écrasé.
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f
          "
