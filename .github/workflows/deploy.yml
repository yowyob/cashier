name: Deploy (server)

on:
  workflow_run:
    workflows: ["Publish Docker image (GHCR)"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-cashier
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy through server agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.repository == 'yowyob/cashier' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    env:
      AGENT: https://kernel-core.yowyob.com/_agent
      SERVICE: cashier
    steps:
      - name: Request immutable deployment
        env:
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -sS --fail-with-body --max-time 60 \
            -X POST -H "Authorization: Bearer $AGENT_TOKEN" \
            "$AGENT/deploy/$SERVICE")
          echo "$response"
          echo "$response" | grep -q '"accepted": *true'

      - name: Confirm actual deployment result
        env:
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            status=$(curl -sS --max-time 20 \
              -H "Authorization: Bearer $AGENT_TOKEN" \
              "$AGENT/deployments" \
              | jq -r --arg service "$SERVICE" \
                '[.[] | select(.service == $service)] | .[0].status // "none"')
            if [ "$status" = "success" ]; then
              echo "Deployment confirmed by agent."
              exit 0
            fi
            if [ "$status" = "failed" ] || [ "$status" = "error" ]; then
              echo "Deployment agent reported a failure." >&2
              exit 1
            fi
            echo "attempt $attempt: $status"
            sleep 15
          done
          echo "Deployment outcome was not confirmed in time." >&2
          exit 1

      - name: Verify public service
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
            https://cashier.yowyob.com/login || echo 000)
          echo "https://cashier.yowyob.com/login returned $code"
          [ "$code" = "200" ]
