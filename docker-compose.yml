# Déploiement INDÉPENDANT du frontend caisse, branché sur l'infra partagée (réseau iwm-vm-network).
# Le frontend appelle le BFF caisse (conteneur erp-cashier-backend) par son nom de service.
#
#   cp .env.example .env   # renseigner AUTH_SECRET + tenant
#   docker compose up -d --build

services:
  erp-cashier:
    build:
      context: .
      dockerfile: Dockerfile
    image: erp-cashier-frontend:local
    container_name: erp-cashier-frontend
    restart: unless-stopped
    environment:
      ERP_CASHIER_BACKEND_URL: ${ERP_CASHIER_BACKEND_URL:-http://erp-cashier-backend:8081}
      ERP_TENANT_ID: ${ERP_TENANT_ID:-11111111-1111-1111-1111-111111111111}
      AUTH_SECRET: ${AUTH_SECRET:?Definir AUTH_SECRET}
      USE_LOCAL_AUTH: ${USE_LOCAL_AUTH:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - erp-cashier-data:/app/data
    ports:
      - "${FRONTEND_PUBLIC_PORT:-3000}:3000"
    networks:
      - iwm

volumes:
  erp-cashier-data:

networks:
  iwm:
    external: true
    name: iwm-vm-network
