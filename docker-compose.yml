# Déploiement INDÉPENDANT du frontend caisse.
# Le front NE communique QU'AVEC son BFF (erp-cashier-backend) — JAMAIS directement avec iwm (B2B).
# Il rejoint uniquement le réseau privé "cashier-net" (créé par le compose du BFF), pas le réseau infra iwm.
# Déployer le BFF AVANT le front (le BFF crée cashier-net).
#
#   cp .env.example .env   # renseigner AUTH_SECRET + tenant
#   docker compose up -d --build

services:
  erp-cashier:
    build:
      context: .
      dockerfile: Dockerfile
    image: erp-cashier-frontend:local
    container_name: erp-cashier-frontend
    restart: unless-stopped
    environment:
      # B2B strict : les DEUX cibles de routing (cashier + gestion-tiers) pointent sur le BFF caisse.
      # Le front ne joint jamais iwm directement ; le BFF relaie les appels gestion-tiers vers iwm.
      ERP_CASHIER_BACKEND_URL: ${ERP_CASHIER_BACKEND_URL:-http://erp-cashier-backend:8081}
      GESTION_TIERS_BACKEND_URL: ${GESTION_TIERS_BACKEND_URL:-http://erp-cashier-backend:8081}
      ERP_TENANT_ID: ${ERP_TENANT_ID:-11111111-1111-1111-1111-111111111111}
      AUTH_SECRET: ${AUTH_SECRET:?Definir AUTH_SECRET}
      USE_LOCAL_AUTH: ${USE_LOCAL_AUTH:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - erp-cashier-data:/app/data
    # Routé par Traefik (caisse.<IP>.nip.io) → plus de port hôte.
    # NB : le front appelle son BFF côté serveur (nom de conteneur), pas depuis le navigateur.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cashier-front.rule=Host(`caisse.${PUBLIC_HOST:-localhost}`)"
      - "traefik.http.routers.cashier-front.entrypoints=web"
      - "traefik.http.services.cashier-front.loadbalancer.server.port=3000"
      - "traefik.docker.network=cashier-net"
    networks:
      - cashier

volumes:
  erp-cashier-data:

networks:
  # Réseau privé front ↔ BFF uniquement (créé par le compose du BFF). Pas d'accès à iwm.
  cashier:
    external: true
    name: cashier-net
